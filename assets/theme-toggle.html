<script>
  // Pick light/dark before first paint: saved choice, else the visitor's system setting
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("ms-theme"); } catch (e) {}
    var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
  })();

  document.addEventListener("DOMContentLoaded", function () {
    var bar = document.createElement("div");
    bar.className = "ms-topbar";
    bar.innerHTML =
      '<a href="https://mikaelsyed.com/Projects/">← mikaelsyed.com</a>' +
      '<button type="button" id="ms-theme-toggle">Light / dark</button>';
    document.body.insertBefore(bar, document.body.firstChild);
    document.getElementById("ms-theme-toggle").addEventListener("click", function () {
      var root = document.documentElement;
      var next = root.getAttribute("data-bs-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-bs-theme", next);
      try { localStorage.setItem("ms-theme", next); } catch (e) {}
    });
  });
</script>
